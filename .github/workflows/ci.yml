name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly
    - cron: '0 0 * * 0'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.3.2

    - name: Run Bandit Security Scan
      run: |
        uvx --from 'bandit==1.9.4' bandit -r ubuntu_mcp_server -f json -o bandit-report.json || true
        uvx --from 'bandit==1.9.4' bandit -r ubuntu_mcp_server

    - name: Run application security checks
      run: uv run python -m ubuntu_mcp_server --security-test

    - name: Check Dependencies for Vulnerabilities
      run: |
        uvx --from safety safety check --json --output safety-report.json || true
        uvx --from safety safety check

    - name: Upload Security Reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - uses: astral-sh/setup-uv@v10.3.2

    - name: Install package
      run: uv sync --frozen

    - name: Test MCP protocol and command policies
      run: uv run python -m unittest discover -s tests -v

    - name: Build distributions
      run: uv build

  integration-test:
    name: Installed Package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: '3.12'
    - run: uv tool install .
    - run: ubuntu-mcp-server --help

  go-control-plane:
    name: Go MCP and control plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ufm-test-password
          POSTGRES_DB: ufm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ufm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      UFM_TEST_DATABASE_URL: postgres://postgres:ufm-test-password@localhost:5432/ufm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true
      - name: Test Go MCP and control plane
        run: go test ./... -count=1
      - name: Vet Go code
        run: go vet ./...
      - name: Build Go binaries
        run: go build ./...

  connector-parity:
    name: Python and Node MCP connector parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connectors/node/package-lock.json
      - name: Build Go MCP runtime and HTTP contract fixture
        run: |
          mkdir -p build
          GOTOOLCHAIN=go1.27.3 go build -trimpath -o build/ubuntu-fleet-manager ./cmd/ubuntu-fleet-manager
          GOTOOLCHAIN=go1.27.3 go build -trimpath -o build/contract-server ./tests/contract-server
      - name: Install Python connector
        run: uv sync --project connectors/python --locked
      - name: Install Node connector
        run: npm ci --prefix connectors/node
      - name: Test Python MCP integration
        env:
          UFM_SERVER_BINARY: ${{ github.workspace }}/build/ubuntu-fleet-manager
          UFM_HTTP_SERVER_BINARY: ${{ github.workspace }}/build/contract-server
        run: uv run --project connectors/python --locked python -m unittest discover -s connectors/python/tests -v
      - name: Test Node MCP integration
        env:
          UFM_SERVER_BINARY: ${{ github.workspace }}/build/ubuntu-fleet-manager
          UFM_HTTP_SERVER_BINARY: ${{ github.workspace }}/build/contract-server
        run: npm test --prefix connectors/node

  clean-deployment:
    name: Clean Compose deployment acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Build the runtime and test OIDC issuer
        run: |
          mkdir -p build
          GOTOOLCHAIN=go1.27.3 go build -trimpath -o build/ubuntu-fleet-manager ./cmd/ubuntu-fleet-manager
          GOTOOLCHAIN=go1.27.3 go build -trimpath -o build/oidc-fixture ./tests/oidc-fixture
      - name: Install Python connector
        run: uv sync --project connectors/python --locked
      - name: Start a clean image and verify the real deployment flow
        env:
          UFM_SERVER_BINARY: ${{ github.workspace }}/build/ubuntu-fleet-manager
          UFM_OIDC_FIXTURE_BINARY: ${{ github.workspace }}/build/oidc-fixture
        run: uv run --project connectors/python --locked python tests/acceptance/compose_smoke.py

  ubuntu-26-behavior:
    name: Host behavior on Ubuntu 26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    services:
      postgres:
        image: docker.io/library/postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ufm-test-password
          POSTGRES_DB: ufm_test
        options: >-
          --health-cmd "pg_isready -U postgres -d ufm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      UFM_TEST_DATABASE_URL: postgres://postgres:ufm-test-password@postgres:5432/ufm_test?sslmode=disable
    steps:
      - name: Install runner prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git tar
      - uses: actions/checkout@v7
      - name: Set up Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true
      - name: Test Go behavior in Ubuntu 26.04 container
        run: go test ./... -count=1

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test, security-scan, integration-test, go-control-plane, connector-parity, clean-deployment, ubuntu-26-behavior]
    steps:
    - uses: actions/checkout@v7

    - name: Security scan summary
      run: |
        echo "🔒 Security Scan Summary:"
        echo "✅ Bandit static analysis completed"
        echo "✅ Dependency vulnerability scan completed"
        echo "✅ Security policy tests passed"

    - name: Release readiness report
      run: |
        echo "🚀 Release Readiness Report:"
        echo "✅ All tests passing"
        echo "✅ Security scans clean"
        echo "✅ Integration tests passed"
        echo "Ready for release! 🎉"
