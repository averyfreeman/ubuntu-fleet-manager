[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ubuntu-fleet-manager-client"
version = "0.1.0"
description = "Thin Python MCP client for the Ubuntu Fleet Manager Go runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.1.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntu_fleet_manager_client"]
